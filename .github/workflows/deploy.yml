name: Deploy to Cloud Run

# Builds the nginx static-site image and deploys it to Cloud Run on every
# push to main. One-time GCP setup: scripts/gcp-provision.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: tolowa-studio
  GCP_REGION: us-west1
  AR_REPO: jerameyjames-com
  SERVICE_NAME: jerameyjames-com
  RUNTIME_SA: jerameyjames-com-runtime@tolowa-studio.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/895468771800/locations/global/workloadIdentityPools/github/providers/tolowa-studio-github' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'jerameyjames-com-deployer@tolowa-studio.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/site:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${GCP_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE}" \
            --service-account "${RUNTIME_SA}" \
            --port 8080 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 128Mi \
            --cpu 1 \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${GCP_PROJECT}" --region "${GCP_REGION}" \
            --format='value(status.url)')
          echo "Service URL: ${URL}"
          for path in / /hero.jpg /portrait.jpg /healthz; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}${path}")
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done
          curl -s "${URL}/" | grep -q "<title>"
