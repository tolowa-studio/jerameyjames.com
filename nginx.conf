# Mirrors the old Cloudflare Pages behaviour: clean URLs, /index.html
# redirects to /, and unknown paths fall back to index.html with a 200.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    # Cloud Run's front end adds Via, which would otherwise disable gzip.
    gzip_proxied any;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Locations below set no add_header of their own, so they all inherit these.
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirect only what the client asked for: `index` and the try_files
    # fallback rewrite / and unknown paths to /index.html internally.
    location = /index.html {
        if ($request_uri ~ "^/index\.html(\?|$)") {
            return 308 /;
        }
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
